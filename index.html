<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Directorio Zona Libre de Colón</title>
    <script>
      // Polyfill global and process
      window.global = window;
      window.process = { env: {} };
      
      // Catch and ignore errors when something tries to overwrite window.fetch
      (function() {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return originalFetch; },
            set: function() { 
              console.warn('Prevented an attempt to overwrite window.fetch');
            }
          });
        } catch (e) {
          console.error('Failed to redefine window.fetch:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
